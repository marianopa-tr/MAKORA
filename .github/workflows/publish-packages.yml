name: Publish Shared App Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image namespace
        id: namespace
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Shared app image metadata
        id: shared_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.namespace.outputs.owner_lc }}/makora-shared-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push shared app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.shared
          push: true
          tags: ${{ steps.shared_meta.outputs.tags }}
          labels: ${{ steps.shared_meta.outputs.labels }}
