# ── Makora Shared App — Single Container Compose ──────────────────────
# Runs the full shared app (worker + dashboard) in one image.
#
# Usage:
#   1. cp .env.docker.example .env.docker
#   2. Edit .env.docker with your API keys
#   3. docker compose -f docker-compose.single.yml up --build
#   4. Open http://localhost:3000/app
# ───────────────────────────────────────────────────────────────────────

services:
  shared-app:
    image: ghcr.io/${GHCR_NAMESPACE:-marianopa-tr}/makora-shared-app:latest
    build:
      context: .
      dockerfile: Dockerfile.shared
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
      - "${WORKER_PORT:-8788}:8788"
    env_file:
      - .env.docker
    volumes:
      - worker-state:/app/.wrangler/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8788/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  worker-state:
    driver: local
